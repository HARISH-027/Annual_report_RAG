<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annual Report Analyst</title>
<style>
:root{
  --bg:#f5f7fa; --surface:#ffffff; --border:#e3e8ef; --text:#1c2733; --muted:#6a7787;
  --accent:#1f4e8c; --accent-soft:#e8f0fa; --good:#177245; --good-soft:#e5f4ec;
  --warn:#9a6700; --warn-soft:#fff4d6; --bad:#b42318; --bad-soft:#fdecea; --radius:10px;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.55 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex}
aside{width:292px;flex:none;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.brand{padding:18px 20px;border-bottom:1px solid var(--border)}
.brand h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.1px}
.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}
.sec{padding:14px 20px;border-bottom:1px solid var(--border)}
.sec h2{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 9px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;margin:0 6px 6px 0;padding:5px 11px;border:1px solid var(--border);border-radius:999px;background:#fff;cursor:pointer;font-size:12.5px;user-select:none;transition:.12s}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.skill{display:block;width:100%;text-align:left;margin-bottom:7px;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;transition:.12s}
.skill:hover{border-color:var(--accent)}
.skill.on{background:var(--accent-soft);border-color:var(--accent)}
.skill b{display:block;font-size:13px}
.skill span{display:block;color:var(--muted);font-size:11.5px;line-height:1.35;margin-top:2px}
.hint{color:var(--muted);font-size:11.5px;margin-top:4px}
.ex{display:block;width:100%;text-align:left;border:none;background:none;padding:6px 0;color:var(--accent);cursor:pointer;font-size:12.5px}
.ex:hover{text-decoration:underline}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header.top{height:54px;flex:none;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
header.top .t{font-weight:600}
header.top .m{color:var(--muted);font-size:12px}
#chat{flex:1;overflow-y:auto;padding:24px;scroll-behavior:smooth}
.wrap{max-width:860px;margin:0 auto}
.msg{margin-bottom:22px}
.user{display:flex;justify-content:flex-end}
.user .bubble{background:var(--accent);color:#fff;padding:10px 15px;border-radius:14px 14px 3px 14px;max-width:80%}
.bot .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 20px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{font-size:11px;padding:2px 9px;border-radius:999px;background:#eef1f5;color:#44505f;border:1px solid var(--border)}
.tag.good{background:var(--good-soft);color:var(--good);border-color:#bfe3cf}
.tag.warn{background:var(--warn-soft);color:var(--warn);border-color:#f1dd9b}
.tag.bad{background:var(--bad-soft);color:var(--bad);border-color:#f4c7c2}
.md h1,.md h2,.md h3,.md h4{margin:14px 0 6px;font-size:14.5px}
.md h1{font-size:16px}
.md p{margin:6px 0}
.md ul,.md ol{margin:6px 0;padding-left:22px}
.md table{border-collapse:collapse;margin:10px 0;width:100%;font-size:12.8px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--border);padding:6px 9px;text-align:left;vertical-align:top}
.md th{background:#f0f3f7;font-weight:600}
.md code{background:#eef1f5;padding:1px 5px;border-radius:4px}
.cite{display:inline-block;font-size:10.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 5px;margin:0 1px;cursor:pointer;vertical-align:baseline}
.cite:hover{background:var(--accent);color:#fff}
.foot{margin-top:12px;padding-top:10px;border-top:1px solid var(--border);display:flex;gap:14px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12px}
.foot button{border:none;background:none;color:var(--accent);cursor:pointer;font-size:12px;padding:0}
.foot button:hover{text-decoration:underline}
.trace{display:none;margin-top:8px;font-size:12px;color:var(--muted)}
.trace.open{display:block}
.trace li{margin:2px 0}
.ev{display:none;margin-top:10px}
.ev.open{display:block}
.evi{border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:#fbfcfd}
.evi.hl{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.evh{padding:7px 11px;font-size:12px;display:flex;gap:8px;align-items:center;cursor:pointer;flex-wrap:wrap}
.evh b{color:var(--accent)}
.evb{display:none;padding:0 11px 10px;font-size:12px;white-space:pre-wrap;color:#33404f;max-height:300px;overflow:auto;font-family:ui-monospace,Consolas,monospace}
.evi.open .evb{display:block}
.typing{color:var(--muted)}
.typing:after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:6px;animation:p 1s infinite}
@keyframes p{0%,100%{opacity:.2}50%{opacity:1}}
.empty{text-align:center;color:var(--muted);margin-top:11vh}
.empty h2{color:var(--text);font-size:20px;margin-bottom:4px}
.empty .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:22px;text-align:left}
.empty .c{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;cursor:pointer;box-shadow:var(--shadow)}
.empty .c:hover{border-color:var(--accent)}
.empty .c b{display:block;font-size:13px;margin-bottom:3px}
.empty .c span{font-size:12px;color:var(--muted)}
form{flex:none;background:var(--surface);border-top:1px solid var(--border);padding:14px 24px}
.box{max-width:860px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
textarea{flex:1;resize:none;border:1px solid var(--border);border-radius:var(--radius);padding:10px 13px;font:inherit;max-height:140px;outline:none;background:#fff}
textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.send{border:none;background:var(--accent);color:#fff;border-radius:var(--radius);padding:10px 20px;font-weight:600;cursor:pointer;font-size:14px}
.send:disabled{opacity:.5;cursor:default}
.note{max-width:860px;margin:6px auto 0;color:var(--muted);font-size:11.5px}
@media(max-width:820px){aside{display:none}#chat{padding:14px}form{padding:10px 14px}}
</style>
</head>
<body>
<aside>
  <div class="brand"><h1>Annual Report Analyst</h1><p>Grounded answers from FY 2024-25 reports</p></div>
  <div class="sec"><h2>Companies</h2><div id="companies"></div><div class="hint">None selected = search all five.</div></div>
  <div class="sec"><h2>Analysis lens</h2><div id="skills"></div><div class="hint">Auto-selected from your question unless you choose one.</div></div>
  <div class="sec"><h2>Try asking</h2>
    <button class="ex">What are the key audit matters reported by the auditor of IRCTC?</button>
    <button class="ex">Identify the main risks disclosed by Hindustan Copper</button>
    <button class="ex">What pain points does SAIL report in its operations?</button>
    <button class="ex">Compare total income and profit after tax of ONGC and OVL</button>
    <button class="ex">Raise CA auditor observations on ONGC's contingent liabilities</button>
  </div>
  <div class="sec" id="about" style="margin-top:auto;border-bottom:none;color:var(--muted);font-size:11.5px"></div>
</aside>
<main>
  <header class="top"><div class="t">Report Q&amp;A</div><div class="m" id="hdrmeta"></div></header>
  <div id="chat"><div class="wrap" id="log"></div></div>
  <form id="f">
    <div class="box"><textarea id="q" rows="1" placeholder="Ask about financials, audit matters, risks or pain points..."></textarea><button class="send" id="send">Ask</button></div>
    <div class="note">Answers use only the retrieved report excerpts. Click a citation chip to see its source.</div>
  </form>
</main>
<script>
const $=s=>document.querySelector(s);
const log=$('#log'), chat=$('#chat'), q=$('#q'), send=$('#send');
let selCo=new Set(), selSk=new Set(), history=[];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function inline(s){
  s=esc(s).replace(/&lt;br\s*\/?&gt;/gi,'<br>');
  s=s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*(?!\s)(.+?)\*/g,'$1<i>$2</i>').replace(/`(.+?)`/g,'<code>$1</code>');
  return s.replace(/\[(C\d+)\]/g,'<span class="cite" data-c="$1">$1</span>');
}
function md(src){
  const L=src.replace(/\r/g,'').split('\n'); let h='',i=0;
  while(i<L.length){
    let l=L[i];
    if(/^\s*\|.*\|\s*$/.test(l)&&i+1<L.length&&/^\s*\|[\s:|-]+\|\s*$/.test(L[i+1])){
      const row=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const hd=row(l); i+=2; let b='';
      while(i<L.length&&/^\s*\|.*\|\s*$/.test(L[i])){b+='<tr>'+row(L[i]).map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>';i++}
      h+='<table><thead><tr>'+hd.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'+b+'</tbody></table>'; continue;
    }
    let m;
    if(m=l.match(/^(#{1,4})\s+(.*)/)){h+=`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`;i++;continue}
    if(/^\s*[-*•]\s+/.test(l)){h+='<ul>';while(i<L.length&&/^\s*[-*•]\s+/.test(L[i])){h+='<li>'+inline(L[i].replace(/^\s*[-*•]\s+/,''))+'</li>';i++}h+='</ul>';continue}
    if(/^\s*\d+[.)]\s+/.test(l)){h+='<ol>';while(i<L.length&&/^\s*\d+[.)]\s+/.test(L[i])){h+='<li>'+inline(L[i].replace(/^\s*\d+[.)]\s+/,''))+'</li>';i++}h+='</ol>';continue}
    if(l.trim()===''){i++;continue}
    let p=[l];i++;
    while(i<L.length&&L[i].trim()!==''&&!/^(#{1,4}\s|\s*[-*•]\s|\s*\d+[.)]\s|\s*\|)/.test(L[i])){p.push(L[i]);i++}
    h+='<p>'+inline(p.join(' '))+'</p>';
  }
  return h;
}

function toggle(set,k,el){set.has(k)?set.delete(k):set.add(k);el.classList.toggle('on')}
async function init(){
  const m=await (await fetch('/api/meta')).json();
  $('#companies').innerHTML=''; m.companies.forEach(c=>{const e=document.createElement('span');e.className='chip';e.textContent=c.name;e.onclick=()=>toggle(selCo,c.key,e);$('#companies').append(e)});
  m.skills.forEach(s=>{const e=document.createElement('button');e.className='skill';e.type='button';e.innerHTML=`<b>${esc(s.title)}</b><span>${esc(s.description)}</span>`;e.onclick=()=>toggle(selSk,s.name,e);$('#skills').append(e)});
  $('#hdrmeta').textContent=`${m.chunks.toLocaleString()} indexed passages · ${m.embed_model.split('/').pop()} · FAISS`;
  $('#about').textContent='Model: '+m.model;
  empty();
}
function empty(){
  log.innerHTML=`<div class="empty"><h2>Ask about the annual reports</h2><div>ONGC · OVL · IRCTC · Hindustan Copper · SAIL — FY 2024-25</div>
  <div class="cards">
   <div class="c" data-q="Give a CA auditor review of SAIL: opinion, key audit matters and remarks"><b>CA auditor review</b><span>Opinion, KAMs, controls, compliance</span></div>
   <div class="c" data-q="What are the main risks disclosed by ONGC?"><b>Risk analysis</b><span>Financial, operational, regulatory</span></div>
   <div class="c" data-q="What pain points does IRCTC report?"><b>Pain points</b><span>Challenges and worsening metrics</span></div>
   <div class="c" data-q="Compare revenue from operations and profit after tax of SAIL and Hindustan Copper"><b>Compare companies</b><span>Side-by-side from reported figures</span></div>
  </div></div>`;
  log.querySelectorAll('.c').forEach(c=>c.onclick=()=>ask(c.dataset.q));
}
document.addEventListener('click',e=>{
  if(e.target.classList.contains('ex')) ask(e.target.textContent);
  if(e.target.classList.contains('cite')){
    const card=e.target.closest('.card'); const ev=card.querySelector('.ev'); ev.classList.add('open');
    const it=ev.querySelector(`[data-id="${e.target.dataset.c}"]`); if(it){it.classList.add('open','hl');it.scrollIntoView({block:'nearest',behavior:'smooth'});setTimeout(()=>it.classList.remove('hl'),1800)}
  }
});
function addUser(t){const d=document.createElement('div');d.className='msg user';d.innerHTML='<div class="bubble">'+esc(t)+'</div>';log.append(d)}
function render(r,box){
  const g=r.grounding, p=r.plan; let tags='';
  tags+=`<span class="tag">${esc(p.intent)}</span>`;
  (p.companies||[]).forEach(c=>tags+=`<span class="tag">${esc(c.replace('_',' '))}</span>`);
  (p.skills||[]).forEach(s=>tags+=`<span class="tag">skill: ${esc(s.replace(/_/g,' '))}</span>`);
  if(g){const cls=g.status==='verified'?'good':g.status==='partial'?'warn':'bad';
    tags+=`<span class="tag ${cls}">${g.status==='verified'?'✓ grounded':g.status==='partial'?'partly verified':'unverified'}</span>`;
    if(g.numbers_unmatched&&g.numbers_unmatched.length) tags+=`<span class="tag warn" title="Not found verbatim in evidence">check: ${esc(g.numbers_unmatched.join(', '))}</span>`}
  const evs=(r.evidence||[]).map(e=>`<div class="evi" data-id="${e.cid}"><div class="evh" onclick="this.parentNode.classList.toggle('open')"><b>${e.cid}</b><span>${esc(e.company.replace('_',' '))}</span><span class="tag">${e.kind}${e.stmt?' · '+esc(e.stmt.replace('_',' ')):''}</span><span>p.${e.page??'-'}</span><span style="color:var(--muted)">${esc((e.title||e.section||'').slice(0,70))}</span></div><div class="evb">${esc(e.text)}</div></div>`).join('');
  const u=r.usage||{};
  box.innerHTML=`<div class="meta">${tags}</div><div class="md">${md(r.answer)}</div>
  <div class="foot"><span>${u.prompt+u.completion} tokens · ${u.calls} LLM call${u.calls===1?'':'s'}${r.cached?' · cached':''} · ${r.seconds}s</span>
  ${evs?`<button onclick="this.closest('.card').querySelector('.ev').classList.toggle('open')">Sources (${r.evidence.length})</button>`:''}
  <button onclick="this.closest('.card').querySelector('.trace').classList.toggle('open')">How this was answered</button></div>
  <ul class="trace">${(r.trace||[]).map(t=>'<li>'+esc(t)+'</li>').join('')}${p.q?`<li>Rephrased query: “${esc(p.q)}”</li>`:''}</ul>
  <div class="ev">${evs}</div>`;
}
async function ask(text){
  text=text.trim(); if(!text||send.disabled) return;
  if(log.querySelector('.empty')) log.innerHTML='';
  addUser(text); q.value=''; q.style.height='auto'; send.disabled=true;
  const bot=document.createElement('div'); bot.className='msg bot'; bot.innerHTML='<div class="card"><span class="typing">Retrieving evidence and drafting</span></div>'; log.append(bot);
  chat.scrollTop=chat.scrollHeight;
  const box=bot.firstChild;
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:text,history:history,companies:[...selCo],skills:[...selSk]})});
    const r=await res.json(); if(!res.ok) throw new Error(r.detail||'Request failed');
    render(r,box); history.push({q:text,a:r.answer.slice(0,300)}); history=history.slice(-3);
  }catch(e){box.innerHTML='<div class="tag bad">Error</div><p>'+esc(e.message)+'</p><p style="color:var(--muted)">The free model may be busy - please retry.</p>'}
  send.disabled=false; chat.scrollTop=chat.scrollHeight; q.focus();
}
$('#f').onsubmit=e=>{e.preventDefault();ask(q.value)};
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(q.value)}});
q.addEventListener('input',()=>{q.style.height='auto';q.style.height=Math.min(q.scrollHeight,140)+'px'});
init();
</script>
</body>
</html>
