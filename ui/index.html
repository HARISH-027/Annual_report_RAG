<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FINORA · Financial Intelligence &amp; Research Assistant</title>
<link rel="icon" href="/static/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Primary">
    <div class="sb-top">
      <div class="brand">
        <img src="/static/assets/logo.svg" alt="" width="30" height="30">
        <div class="txt"><span class="wm">FINORA</span><span class="sub">Financial Intelligence &amp; Research Assistant</span></div>
      </div>
      <button class="icon-btn" id="collapse" aria-label="Collapse sidebar" title="Collapse sidebar"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
    </div>
    <nav class="nav" aria-label="Workspace">
      <button class="nav-item primary" id="new"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>New analysis</span></button>
      <button class="nav-item" data-dlg="dlg-corpus"><svg class="ico" viewBox="0 0 24 24"><path d="M4 5h6a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h6z"/></svg><span>Report library</span></button>
      <button class="nav-item" data-dlg="dlg-lens"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4-4"/></svg><span>Analysis lenses</span></button>
    </nav>
    <div class="sb-label">Recent</div>
    <input class="search" id="convsearch" type="search" placeholder="Search conversations" aria-label="Search conversations">
    <div class="convs" id="convs" role="list"></div>
    <div class="sb-foot">
      <button class="nav-item" data-dlg="dlg-settings"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.4 2.7a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.4-2.7a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.5c.1-.4.2-.8.2-1.2z"/></svg><span>Settings</span></button>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu" id="menu" aria-label="Open navigation"><svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="ctx"><b id="ctx-title">New analysis</b><span id="ctx-scope"></span></div>
      <div class="status-pill" id="status" role="status"><span class="dot off"></span><span>Connecting…</span></div>
    </header>
    <div class="scroll" id="scroll"><div class="col" id="thread"></div></div>
    <button class="story-fab" id="story-fab" aria-label="Open Inside the AI Workspace"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="9" rx="2"/><path d="M7 11V6h10v5"/></svg><span>Inside the AI Workspace</span></button>
    <div class="composer-wrap" id="composer-wrap">
      <div id="story-slot-mobile"></div>
      <form class="composer" id="form" autocomplete="off">
        <label for="q" class="sr-only">Ask a question about your financial documents</label>
        <textarea id="q" rows="1" maxlength="1500" placeholder="Ask a question about your financial documents..."></textarea>
        <div class="comp-row">
          <div class="scope" id="scope-chips"></div>
          <button class="send" id="send" type="submit"><span id="send-label">Ask</span><svg class="ico" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        </div>
      </form>
      <div class="hint">Answers use only retrieved report excerpts. Enter to send · Shift+Enter for a new line.</div>
    </div>
  </div>

  <aside class="rail" id="rail" aria-label="Evidence and workspace">
    <div class="rail-inner">
      <section class="ev-panel" id="ev-panel" hidden aria-label="Evidence">
        <div class="panel-head"><span id="ev-title">Evidence</span><button class="icon-btn" id="ev-close" aria-label="Close evidence panel"><svg class="ico" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
        <div class="ev-list" id="ev-list"></div>
      </section>
      <section class="story" id="story" aria-label="Inside the AI Workspace">
        <div class="story-head"><h3>Inside the AI Workspace</h3><button class="icon-btn" id="story-toggle" aria-expanded="true" aria-label="Collapse workspace pane"><svg class="ico" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button></div>
        <div class="story-body" id="story-body"></div>
      </section>
    </div>
  </aside>
</div>

<dialog id="dlg-corpus" aria-labelledby="t-corpus"><div class="dlg-head"><h2 id="t-corpus">Report library</h2><button class="icon-btn" data-close aria-label="Close"><svg class="ico" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div class="dlg-body" id="corpus-body"></div></dialog>
<dialog id="dlg-lens" aria-labelledby="t-lens"><div class="dlg-head"><h2 id="t-lens">Analysis lenses</h2><button class="icon-btn" data-close aria-label="Close"><svg class="ico" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div class="dlg-body" id="lens-body"></div></dialog>
<dialog id="dlg-settings" aria-labelledby="t-set"><div class="dlg-head"><h2 id="t-set">Settings</h2><button class="icon-btn" data-close aria-label="Close"><svg class="ico" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div class="dlg-body" id="settings-body"></div></dialog>

<script type="module" src="/static/js/main.js"></script>
</body>
</html>
